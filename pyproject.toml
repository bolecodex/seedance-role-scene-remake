[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seedance-role-scene-remake"
version = "0.5.0"
description = "Seedance 2.0 powered video character, scene, and voice remake CLI"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "tos>=2.7.0",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
seedance-role-scene-remake = "seedance_role_scene_remake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seedance_role_scene_remake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
